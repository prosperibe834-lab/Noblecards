name: noble_cards
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  intl_phone_field: ^3.2.0
  country_picker: ^2.0.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  boxicons: ^2.1.3
  local_auth: ^3.0.2
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0
  shimmer: ^3.0.0
  intl: ^0.20.2
  pay: ^2.0.0
  image_picker: ^1.2.3
  shared_preferences: ^2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets directory
  assets:
    - lib/assets/logos/
    - lib/assets/logos/
    - lib/assets/onboarding/
    - assets/payment_configs/google_pay_config.json
    - assets/payment_configs/apple_pay_config.json

  # Custom Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: lib/assets/fonts/Poppins-Regular.ttf
        - asset: lib/assets/fonts/Poppins-Bold.ttf

    - family: Inter
      fonts:
        - asset: lib/assets/fonts/Inter-Regular.ttf
        - asset: lib/assets/fonts/Inter-Medium.ttf

    - family: SpaceGrotesk
      fonts:
        - asset: lib/assets/fonts/SpaceGrotesk-Bold.ttf




